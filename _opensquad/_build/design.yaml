        file: "tasks/identificar-riscos.md"
        description: "Identifica e categoriza riscos usando técnicas PMBOK (brainstorming, checklist, análise de premissas)"
      - name: "criar-plano-riscos"
        file: "tasks/criar-plano-riscos.md"
        description: "Gera a Matriz de Riscos e o Plano de Resposta a Riscos"

  - id: marcela-metrica
    name: "Marcela Métrica"
    title: "Monitora de Performance"
    icon: "📊"
    execution: "subagent"
    role_summary: "Define e monitora KPIs de performance e gera análises de saúde do portfólio"
    skills: []
    tasks:
      - name: "definir-kpis"
        file: "tasks/definir-kpis.md"
        description: "Define os KPIs de monitoramento do projeto (CPI, SPI, EV, etc.)"
      - name: "analisar-performance"
        file: "tasks/analisar-performance.md"
        description: "Analisa a performance atual do projeto e gera relatório de saúde"

  - id: sara-status
    name: "Sara Status"
    title: "Redatora de Relatórios"
    icon: "📝"
    execution: "inline"
    role_summary: "Gera status reports periódicos e pesquisas de satisfação do cliente"
    skills: []
    tasks:
      - name: "gerar-status-report"
        file: "tasks/gerar-status-report.md"
        description: "Gera o Status Report do projeto com semáforo de saúde"
      - name: "pesquisa-satisfacao"
        file: "tasks/pesquisa-satisfacao.md"
