  - id: vera-veredito
    name: "Vera Veredito"
    title: "Revisora de Qualidade VMO"
    icon: "✅"
    execution: "inline"
    role_summary: "Revisora de qualidade: avalia todos os documentos gerados contra critérios PMBOK/VMO"
    skills: []
    tasks:
      - name: "revisar-documentacao"
        file: "tasks/revisar-documentacao.md"
        description: "Revisa toda a documentação do projeto, pontua e emite APROVADO/REPROVADO"

pipeline:
  - step: 1
    name: "Coletar Demanda"
    type: "agent"
    agent: "iara-inbound"
    execution: "subagent"
    output_file: "squads/vmo-autonomo/output/demanda-coletada.md"
    model_tier: "powerful"

  - step: 2
    name: "checkpoint-validar-demanda"
    type: "checkpoint"
    output_file: "squads/vmo-autonomo/output/demanda-validada.md"

  - step: 3
    name: "Qualificar Demanda"
    type: "agent"
    agent: "felipe-filtro"
    execution: "inline"
    input_file: "squads/vmo-autonomo/output/demanda-validada.md"
    output_file: "squads/vmo-autonomo/output/qualificacao.md"

  - step: 4
    name: "checkpoint-aprovar-qualificacao"
    type: "checkpoint"
    output_file: "squads/vmo-autonomo/output/qualificacao-aprovada.md"

  - step: 5
    name: "Criar Documentação Base (paralelo)"
    type: "agent"
    agent: "diana-documento"
    execution: "subagent"
    input_file: "squads/vmo-autonomo/output/qualificacao-aprovada.md"
    output_file: "squads/vmo-autonomo/output/documentacao-base.md"
    model_tier: "powerful"

  - step: 6
    name: "Especificar Requisitos (paralelo)"
    type: "agent"
    agent: "rafael-requisito"
    execution: "subagent"
    input_file: "squads/vmo-autonomo/output/qualificacao-aprovada.md"
    output_file: "squads/vmo-autonomo/output/requisitos.md"
    model_tier: "powerful"

  - step: 7
    name: "Criar Cronograma"
    type: "agent"
    agent: "carlos-cronograma"
    execution: "inline"
    input_file: "squads/vmo-autonomo/output/documentacao-base.md"
    output_file: "squads/vmo-autonomo/output/cronograma.md"

  - step: 8
    name: "Plano de Riscos"
    type: "agent"
    agent: "pedro-perigo"
    execution: "inline"
    input_file: "squads/vmo-autonomo/output/documentacao-base.md"
    output_file: "squads/vmo-autonomo/output/plano-riscos.md"

  - step: 9
    name: "Framework de KPIs"
    type: "agent"
    agent: "marcela-metrica"
    execution: "subagent"
    input_file: "squads/vmo-autonomo/output/documentacao-base.md"
    output_file: "squads/vmo-autonomo/output/kpis.md"
    model_tier: "fast"

  - step: 10
    name: "Status Report Inicial"
    type: "agent"
    agent: "sara-status"
    execution: "inline"
    input_file: "squads/vmo-autonomo/output/documentacao-base.md"
    output_file: "squads/vmo-autonomo/output/status-report-inicial.md"

  - step: 11
    name: "Revisão de Qualidade"
    type: "agent"
    agent: "vera-veredito"
    execution: "inline"
    on_reject: 5
    output_file: "squads/vmo-autonomo/output/revisao-final.md"

  - step: 12
    name: "checkpoint-aprovar-documentacao-final"
    type: "checkpoint"

investigation:
  enriched: false

research_brief: |
  PMO → VMO FRAMEWORK

  VMO (Value Management Office) é a evolução do PMO tradicional, com foco na
  maximização de valor estratégico, não apenas na entrega dentro de prazo/custo.

  Responsabilidades VMO:
  - Alinhamento estratégico do portfólio
  - Definição e rastreamento de KPIs de valor (ROI, satisfação, alinhamento)
  - Governança lean e fluxo contínuo de valor
  - Transição de projetos temporários para produtos duradouros

  DOCUMENTOS CHAVE (PMBOK 7ª ed):
  - Termo de Abertura do Projeto (TAP/Project Charter): autoriza o projeto,
    define objetivos, escopo, partes interessadas, autoridade do GP
  - PM Canvas: visão visual em 9 blocos (por quê, o quê, quem, quando, quanto,
    como, premissas, restrições, riscos)
  - Plano Geral do Projeto: integra 10 planos subsidiários (escopo, prazo,
    custo, qualidade, recursos, comunicações, riscos, aquisições, stakeholders)
  - Especificação de Requisitos Funcionais (ERF): rastreabilidade completa
  - WBS/EAP + Cronograma Detalhado: marcos, dependências, baseline
  - Plano de Riscos: identificação, análise qualitativa/quantitativa, respostas
  - KPIs: CPI (Cost Performance Index), SPI (Schedule Performance Index),
    EV (Earned Value), burndown, health score
  - Status Report: semáforo (verde/amarelo/vermelho), progresso, ações

  IA EM PMOs (2025-2026):
  - PMOs com IA reclamam 3.200h/ano de trabalho administrativo
  - Melhor prática: automação de relatórios + avaliação preditiva de riscos
  - Humanos focam em liderança e estratégia; IA cuida da ciência de estimativa e rastreamento

