squad:
  code: "vmo-autonomo"
  name: "VMO Autônomo"
  description: "Escritório de projetos autônomo PMO→VMO: da captação de demanda até a entrega completa da documentação de iniciação do projeto"

agents:
  - id: iara-inbound
    name: "Iara Inbound"
    title: "Coletora de Demandas"
    icon: "📥"
    execution: "subagent"
    role_summary: "Coleta e lê demandas de qualquer canal: e-mail, Teams, documentos, formulários, atas de reunião"
    skills: []
    tasks:
      - name: "coletar-demanda"
        file: "tasks/coletar-demanda.md"
        description: "Coleta dados da demanda de todos os canais disponíveis"
      - name: "extrair-contexto"
        file: "tasks/extrair-contexto.md"
        description: "Estrutura e normaliza as informações da demanda coletada"

  - id: felipe-filtro
    name: "Felipe Filtro"
    title: "Analista de Qualificação"
    icon: "🔍"
    execution: "inline"
    role_summary: "Qualifica a demanda: analisa viabilidade estratégica, técnica e comercial — decide se pode ser transformada em projeto"
    skills: []
    tasks:
      - name: "qualificar-demanda"
        file: "tasks/qualificar-demanda.md"
        description: "Aplica critérios de qualificação: alinhamento estratégico, viabilidade técnica, impacto e retorno"
      - name: "analise-comercial"
        file: "tasks/analise-comercial.md"
        description: "Analisa viabilidade comercial, ROI estimado e proposta de valor"

  - id: diana-documento
    name: "Diana Documento"
    title: "Arquiteta de Projetos"
    icon: "📋"
    execution: "subagent"
    role_summary: "Cria o Termo de Abertura do Projeto (TAP), PM Canvas e Plano Geral do Projeto"
    skills: []
    tasks:
      - name: "criar-tap"
        file: "tasks/criar-tap.md"
        description: "Cria o Termo de Abertura do Projeto (Project Charter) completo"
      - name: "criar-pm-canvas"
        file: "tasks/criar-pm-canvas.md"
        description: "Cria o PM Canvas com os 9 blocos essenciais"
      - name: "criar-plano-geral"
        file: "tasks/criar-plano-geral.md"
        description: "Cria o Plano Geral do Projeto com todos os planos subsidiários"

  - id: rafael-requisito
    name: "Rafael Requisito"
    title: "Engenheiro de Requisitos"
    icon: "⚙️"
    execution: "subagent"
    role_summary: "Especifica os Requisitos Funcionais e Não-Funcionais com rastreabilidade completa"
    skills: []
    tasks:
      - name: "levantar-requisitos"
        file: "tasks/levantar-requisitos.md"
        description: "Elicita e documenta todos os requisitos do projeto"
      - name: "criar-erf"
        file: "tasks/criar-erf.md"
        description: "Gera o Documento de Especificação de Requisitos Funcionais (ERF)"

  - id: carlos-cronograma
    name: "Carlos Cronograma"
    title: "Planejador de Prazo"
    icon: "📅"
    execution: "inline"
    role_summary: "Cria o cronograma detalhado com WBS, marcos, dependências e baseline de prazo"
    skills: []
    tasks:
      - name: "criar-wbs"
        file: "tasks/criar-wbs.md"
        description: "Cria a Estrutura Analítica do Projeto (WBS/EAP)"
      - name: "criar-cronograma"
        file: "tasks/criar-cronograma.md"
        description: "Gera o cronograma detalhado em formato Markdown com marcos e entregas"

  - id: pedro-perigo
    name: "Pedro Perigo"
    title: "Analista de Riscos"
    icon: "⚠️"
