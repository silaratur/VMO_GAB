name: Sync files from VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-from-vps.yml'

jobs:
  sync:
    runs-on: self-hosted
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy site files from VPS
        run: |
          mkdir -p frontend
          cp /root/www/vmo/*.html frontend/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/
          git diff --cached --quiet || git commit -m "sync: import site files from VPS /root/www/vmo [skip ci]"
          git push origin main
