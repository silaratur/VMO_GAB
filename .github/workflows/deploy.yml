name: Deploy API to VPS

on:
  push:
    branches:
      - master
    paths:
      - 'app/**'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Garantir Python instalado
        run: |
          python3 --version || (apt-get update -qq && apt-get install -y python3 python3-venv python3-pip)

      - name: Setup virtualenv e dependências
        run: |
          mkdir -p /opt/vmo_gab
          python3 -m venv /opt/vmo_gab/venv
          /opt/vmo_gab/venv/bin/pip install -r requirements.txt --quiet
          echo "✅ Dependências instaladas"

      - name: Copiar arquivos da aplicação
        run: |
          cp -r app/ requirements.txt /opt/vmo_gab/
          echo "✅ Arquivos copiados"

      - name: Reiniciar API
        run: |
          pkill -f "uvicorn app.main:app" 2>/dev/null || true
          sleep 1
          cd /opt/vmo_gab
          nohup /opt/vmo_gab/venv/bin/uvicorn app.main:app \
            --host 0.0.0.0 \
            --port 8000 \
            > /opt/vmo_gab/app.log 2>&1 &
          sleep 3
          if curl -sf http://localhost:8000/health; then
            echo "✅ API rodando em http://localhost:8000"
          else
            echo "⚠️ API não respondeu — verificar log:"
            tail -20 /opt/vmo_gab/app.log
          fi
