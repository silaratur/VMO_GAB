name: Deploy Quiz Esquemas
on:
  workflow_dispatch:
    inputs:
      railway_token:
        description: Railway API Token
        required: true
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/modest-carson-mpWwN
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy
        working-directory: quiz-esquemas
        env:
          RAILWAY_TOKEN: ${{ inputs.railway_token }}
        run: |
          railway up --detach --yes
          sleep 20
          OUT=$(railway domain 2>&1 || true)
          echo "$OUT"
          DOMAIN=$(echo "$OUT" | grep -oP 'https?://[^\s]+' | head -1 || true)
          echo "## Deploy concluido!" >> $GITHUB_STEP_SUMMARY
          echo "Participantes: $DOMAIN" >> $GITHUB_STEP_SUMMARY
          echo "Dashboard: ${DOMAIN}/dashboard.html" >> $GITHUB_STEP_SUMMARY
          echo "==========================="
          echo "Participantes: $DOMAIN"
          echo "Dashboard: ${DOMAIN}/dashboard.html"
          echo "==========================="
