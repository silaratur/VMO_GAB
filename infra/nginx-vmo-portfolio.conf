server {
    listen 80;
    listen [::]:80;
    server_name silaratur.cloud www.silaratur.cloud;

    root /var/www/vmo-portfolio;
    index index.html;

    # Portfolio VMO — arquivos estáticos
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Projetos individuais
    location /projetos/ {
        try_files $uri $uri/ =404;
    }

    # Docs dos projetos
    location /projetos/docs/ {
        try_files $uri =404;
        add_header Content-Disposition "attachment";
    }

    # Cache de assets estáticos
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Logs
    access_log /var/log/nginx/vmo-portfolio-access.log;
    error_log  /var/log/nginx/vmo-portfolio-error.log;
}
