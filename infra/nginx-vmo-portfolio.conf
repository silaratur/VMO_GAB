# VMO Portfolio — silaratur.cloud
# Deploy: 2026-05-24

server {
    listen 80;
    listen [::]:80;
    server_name silaratur.cloud www.silaratur.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name silaratur.cloud www.silaratur.cloud;

    ssl_certificate /etc/letsencrypt/live/silaratur.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silaratur.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/vmo-portfolio;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Portfolio VMO — arquivos estáticos
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Projetos individuais
    location /projetos/ {
        try_files $uri $uri/ =404;
    }

    # Docs dos projetos (download)
    location ~* \.(docx|pdf)$ {
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # Cache de assets estáticos
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|md)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Opensquad Dashboard (/agentes) ───────────────────────────────────────

    location /__squads_ws {
        proxy_pass http://127.0.0.1:3001/__squads_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    location = /agentes {
        return 301 /agentes/;
    }

    location /agentes/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    access_log /var/log/nginx/vmo-portfolio-access.log;
    error_log  /var/log/nginx/vmo-portfolio-error.log;
}
