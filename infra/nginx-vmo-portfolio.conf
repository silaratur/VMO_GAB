# VMO Portfolio — silaratur.cloud
# Deploy: 2026-05-17

server {
    listen 80;
    listen [::]:80;
    server_name silaratur.cloud www.silaratur.cloud;

    root /var/www/vmo-portfolio;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Portfolio VMO — arquivos estáticos
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Projetos individuais
    location /projetos/ {
        try_files $uri $uri/ =404;
    }

    # Docs dos projetos (download)
    location ~* \.(docx|pdf)$ {
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # Cache de assets estáticos
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|md)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Logs
    access_log /var/log/nginx/vmo-portfolio-access.log;
    error_log  /var/log/nginx/vmo-portfolio-error.log;
}
