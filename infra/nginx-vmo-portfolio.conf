# VMO Portfolio — silaratur.cloud
# Deploy: 2026-05-17

server {
    listen 80;
    listen [::]:80;
    server_name silaratur.cloud www.silaratur.cloud;

    root /var/www/vmo-portfolio;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Portfolio VMO — arquivos estáticos
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Projetos individuais
    location /projetos/ {
        try_files $uri $uri/ =404;
    }

    # Docs dos projetos (download)
    location ~* \.(docx|pdf)$ {
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # Cache de assets estáticos
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|md)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Opensquad Dashboard (/agentes) ───────────────────────────────────────

    # WebSocket para updates em tempo real
    location /__squads_ws {
        proxy_pass http://127.0.0.1:3001/__squads_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # REST API (snapshot + push-state recebido do runner)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    # Painel de agentes — redireciona sem trailing slash
    location = /agentes {
        return 301 /agentes/;
    }

    # Painel de agentes — SPA + assets estáticos
    location /agentes/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    # Logs
    access_log /var/log/nginx/vmo-portfolio-access.log;
    error_log  /var/log/nginx/vmo-portfolio-error.log;
}
