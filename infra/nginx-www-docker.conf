# VMO Portfolio — nginx config for Traefik www Docker container
# Traefik handles SSL termination; this container listens on port 80 internally
# Deploy path on VPS: /root/nginx-www.conf (mounted into container)

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /projetos/ {
        try_files $uri $uri/ =404;
    }

    location ~* \.(docx|pdf)$ {
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|md)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /__squads_ws {
        proxy_pass http://host.docker.internal:3001/__squads_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    location = /agentes {
        return 301 /agentes/;
    }

    location /agentes/ {
        proxy_pass http://host.docker.internal:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }
}
