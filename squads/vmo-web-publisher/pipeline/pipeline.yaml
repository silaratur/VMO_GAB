pipeline:
  name: "VMO Web Publisher — Atualização do Dashboard"
  version: "1.0.0"
  squad: vmo-web-publisher
  description: >
    Varre todos os projetos VMO, lê os documentos mais recentes e gera/atualiza
    as páginas HTML do dashboard. Roda a cada 6 horas automaticamente.

steps:
  - step: 1
    name: "Escanear Projetos"
    file: steps/step-01-scan-projetos.md
    type: agent
    agent: lucas-layout
    execution: inline

  - step: 2
    name: "Gerar Dashboard Principal"
    file: steps/step-02-gerar-index.md
    type: agent
    agent: lucas-layout
    execution: inline

  - step: 3
    name: "Gerar Páginas por Projeto"
    file: steps/step-03-gerar-paginas-projeto.md
    type: agent
    agent: lucas-layout
    execution: inline
