Properties:
  Name: Screen_Dashboard
  Fill: =RGBA(15, 23, 42, 1)

Controls:

  # === HEADER ===
  Header_Container:
    Control: Rectangle
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =72
      Fill: =RGBA(30, 41, 59, 1)

  Logo_Text:
    Control: Label
    Properties:
      X: =24
      Y: =16
      Width: =200
      Height: =40
      Text: ="🏛️ VMO GAB"
      Color: =RGBA(255, 255, 255, 1)
      Size: =22
      FontWeight: =FontWeight.Bold

  Subtitle_Text:
    Control: Label
    Properties:
      X: =24
      Y: =40
      Width: =300
      Height: =24
      Text: ="Mission Control Center"
      Color: =RGBA(148, 163, 184, 1)
      Size: =13

  Status_Badge:
    Control: Label
    Properties:
      X: =Parent.Width - 200
      Y: =20
      Width: =180
      Height: =32
      Text: ="● OPERACIONAL"
      Color: =RGBA(34, 197, 94, 1)
      Align: =Align.Right
      Size: =13

  Clock_Label:
    Control: Label
    Properties:
      X: =Parent.Width - 200
      Y: =44
      Width: =180
      Height: =20
      Text: =Text(Now(), "dd/mm/yyyy hh:mm")
      Color: =RGBA(148, 163, 184, 1)
      Align: =Align.Right
      Size: =11

  # === NAVEGAÇÃO LATERAL ===
  Nav_Container:
    Control: Rectangle
    Properties:
      X: =0
      Y: =72
      Width: =200
      Height: =Parent.Height - 72
      Fill: =RGBA(15, 23, 42, 1)

  Nav_Dashboard:
    Control: Button
    Properties:
      X: =8
      Y: =90
      Width: =184
      Height: =44
      Text: ="📊  Dashboard"
      Fill: =RGBA(99, 102, 241, 1)
      Color: =RGBA(255, 255, 255, 1)
      BorderRadius: =8
      OnSelect: =Navigate(Screen_Dashboard)

  Nav_KPIs:
    Control: Button
    Properties:
      X: =8
      Y: =142
      Width: =184
      Height: =44
      Text: ="📈  KPIs"
      Fill: =RGBA(30, 41, 59, 1)
      Color: =RGBA(148, 163, 184, 1)
      BorderRadius: =8
      OnSelect: =Navigate(Screen_KPIs)

  Nav_Projetos:
    Control: Button
    Properties:
      X: =8
      Y: =194
      Width: =184
      Height: =44
      Text: ="📋  Projetos"
      Fill: =RGBA(30, 41, 59, 1)
      Color: =RGBA(148, 163, 184, 1)
      BorderRadius: =8
      OnSelect: =Navigate(Screen_Projetos)

  Nav_Riscos:
    Control: Button
    Properties:
      X: =8
      Y: =246
      Width: =184
      Height: =44
      Text: ="⚠️  Riscos"
      Fill: =RGBA(30, 41, 59, 1)
      Color: =RGBA(148, 163, 184, 1)
      BorderRadius: =8
      OnSelect: =Navigate(Screen_Riscos)

  Nav_Alertas:
    Control: Button
    Properties:
      X: =8
      Y: =298
      Width: =184
      Height: =44
      Text: ="🔔  Alertas"
      Fill: =If(AlertasCriticos > 0, RGBA(239, 68, 68, 0.2), RGBA(30, 41, 59, 1))
      Color: =If(AlertasCriticos > 0, RGBA(239, 68, 68, 1), RGBA(148, 163, 184, 1))
      BorderRadius: =8
      OnSelect: =Navigate(Screen_Alertas)

  Nav_Timeline:
    Control: Button
    Properties:
      X: =8
      Y: =350
      Width: =184
      Height: =44
      Text: ="📅  Timeline"
      Fill: =RGBA(30, 41, 59, 1)
      Color: =RGBA(148, 163, 184, 1)
      BorderRadius: =8
      OnSelect: =Navigate(Screen_Timeline)

  # === ÁREA PRINCIPAL ===

  # KPI Cards - Row 1
  Card_TotalProjetos:
    Control: Rectangle
    Properties:
      X: =216
      Y: =84
      Width: =185
      Height: =100
      Fill: =RGBA(30, 41, 59, 1)
      BorderRadius: =12

  Card_TotalProjetos_Label:
    Control: Label
    Properties:
      X: =228
      Y: =96
      Width: =165
      Height: =24
      Text: ="TOTAL PROJETOS"
      Color: =RGBA(148, 163, 184, 1)
      Size: =11

  Card_TotalProjetos_Value:
    Control: Label
    Properties:
      X: =228
      Y: =118
      Width: =165
      Height: =48
      Text: =Text(TotalProjetos)
      Color: =RGBA(255, 255, 255, 1)
      Size: =36
      FontWeight: =FontWeight.Bold

  Card_ProjetosAtivos:
    Control: Rectangle
    Properties:
      X: =413
      Y: =84
      Width: =185
      Height: =100
      Fill: =RGBA(30, 41, 59, 1)
      BorderRadius: =12

  Card_ProjetosAtivos_Label:
    Control: Label
    Properties:
      X: =425
      Y: =96
      Width: =165
      Height: =24
      Text: ="PROJETOS ATIVOS"
      Color: =RGBA(148, 163, 184, 1)
      Size: =11

  Card_ProjetosAtivos_Value:
    Control: Label
    Properties:
      X: =425
      Y: =118
      Width: =165
      Height: =48
      Text: =Text(ProjetosAtivos)
      Color: =RGBA(34, 197, 94, 1)
      Size: =36
      FontWeight: =FontWeight.Bold

  Card_HealthScore:
    Control: Rectangle
    Properties:
      X: =610
      Y: =84
      Width: =185
      Height: =100
      Fill: =RGBA(30, 41, 59, 1)
      BorderRadius: =12

  Card_HealthScore_Label:
    Control: Label
    Properties:
      X: =622
      Y: =96
      Width: =165
      Height: =24
      Text: ="HEALTH SCORE"
      Color: =RGBA(148, 163, 184, 1)
      Size: =11

  Card_HealthScore_Value:
    Control: Label
    Properties:
      X: =622
      Y: =118
      Width: =165
      Height: =48
      Text: =Text(HealthScoreGlobal) & "/100"
      Color: =CorStatus(HealthScoreGlobal)
      Size: =30
      FontWeight: =FontWeight.Bold

  Card_Alertas:
    Control: Rectangle
    Properties:
      X: =807
      Y: =84
      Width: =185
      Height: =100
      Fill: =RGBA(30, 41, 59, 1)
      BorderRadius: =12

  Card_Alertas_Label:
    Control: Label
    Properties:
      X: =819
      Y: =96
      Width: =165
      Height: =24
      Text: ="ALERTAS CRÍTICOS"
      Color: =RGBA(148, 163, 184, 1)
      Size: =11

  Card_Alertas_Value:
    Control: Label
    Properties:
      X: =819
      Y: =118
      Width: =165
      Height: =48
      Text: =Text(AlertasCriticos)
      Color: =If(AlertasCriticos > 0, RGBA(239, 68, 68, 1), RGBA(34, 197, 94, 1))
      Size: =36
      FontWeight: =FontWeight.Bold

  Card_Riscos:
    Control: Rectangle
    Properties:
      X: =1004
      Y: =84
      Width: =185
      Height: =100
      Fill: =RGBA(30, 41, 59, 1)
      BorderRadius: =12

  Card_Riscos_Label:
    Control: Label
    Properties:
      X: =1016
      Y: =96
      Width: =165
      Height: =24
      Text: ="RISCOS ALTOS"
      Color: =RGBA(148, 163, 184, 1)
      Size: =11

  Card_Riscos_Value:
    Control: Label
    Properties:
      X: =1016
      Y: =118
      Width: =165
      Height: =48
      Text: =Text(RiscosAltos)
      Color: =If(RiscosAltos > 3, RGBA(239, 68, 68, 1), RGBA(250, 204, 21, 1))
      Size: =36
      FontWeight: =FontWeight.Bold

  # === LISTA DE PROJETOS ===
  Projetos_Card:
    Control: Rectangle
    Properties:
      X: =216
      Y: =196
      Width: =580
      Height: =340
      Fill: =RGBA(30, 41, 59, 1)
      BorderRadius: =12

  Projetos_Title:
    Control: Label
    Properties:
      X: =232
      Y: =212
      Width: =300
      Height: =28
      Text: ="📋 Portfolio de Projetos"
      Color: =RGBA(255, 255, 255, 1)
      Size: =16
      FontWeight: =FontWeight.Bold

  Projetos_Gallery:
    Control: Gallery
    Properties:
      X: =216
      Y: =248
      Width: =580
      Height: =280
      Items: =Projetos
      TemplatePadding: =8
      TemplateSize: =56

    Controls:
      Row_BG:
        Control: Rectangle
        Properties:
          Width: =Parent.TemplateWidth
          Height: =Parent.TemplateHeight
          Fill: =RGBA(51, 65, 85, 0.4)
          BorderRadius: =8

      StatusDot:
        Control: Label
        Properties:
          X: =8
          Y: =18
          Width: =24
          Height: =24
          Text: =If(ThisItem.HealthScore >= 80, "🟢", If(ThisItem.HealthScore >= 60, "🟡", "🔴"))
          Size: =16

      ProjetoNome:
        Control: Label
        Properties:
          X: =40
          Y: =8
          Width: =280
          Height: =24
          Text: =ThisItem.Title
          Color: =RGBA(255, 255, 255, 1)
          Size: =14
          FontWeight: =FontWeight.Semibold

      ProjetoFase:
        Control: Label
        Properties:
          X: =40
          Y: =30
          Width: =200
          Height: =20
          Text: =ThisItem.Fase
          Color: =RGBA(148, 163, 184, 1)
          Size: =11

      HealthBar_BG:
        Control: Rectangle
        Properties:
          X: =340
          Y: =22
          Width: =180
          Height: =12
          Fill: =RGBA(51, 65, 85, 1)
          BorderRadius: =6

      HealthBar_Fill:
        Control: Rectangle
        Properties:
          X: =340
          Y: =22
          Width: =If(IsBlank(ThisItem.HealthScore), 0, (ThisItem.HealthScore / 100) * 180)
          Height: =12
          Fill: =CorStatus(ThisItem.HealthScore)
          BorderRadius: =6

      HealthScore_Label:
        Control: Label
        Properties:
          X: =524
          Y: =16
          Width: =48
          Height: =24
          Text: =Text(ThisItem.HealthScore) & "%"
          Color: =CorStatus(ThisItem.HealthScore)
          Size: =12

      Selecionar_Btn:
        Control: Button
        Properties:
          X: =Parent.TemplateWidth - 40
          Y: =12
          Width: =32
          Height: =32
          Text: ="→"
          Fill: =RGBA(99, 102, 241, 0.3)
          Color: =RGBA(165, 180, 252, 1)
          BorderRadius: =6
          OnSelect: =Set(gProjetoSelecionado, ThisItem); Navigate(Screen_Projetos)

  # === ALERTAS RECENTES ===
  Alertas_Card:
    Control: Rectangle
    Properties:
      X: =808
      Y: =196
      Width: =380
      Height: =340
      Fill: =RGBA(30, 41, 59, 1)
      BorderRadius: =12

  Alertas_Title:
    Control: Label
    Properties:
      X: =824
      Y: =212
      Width: =300
      Height: =28
      Text: ="🔔 Alertas Recentes"
      Color: =RGBA(255, 255, 255, 1)
      Size: =16
      FontWeight: =FontWeight.Bold

  Alertas_Gallery:
    Control: Gallery
    Properties:
      X: =808
      Y: =248
      Width: =380
      Height: =280
      Items: =FirstN(Alertas, 8)
      TemplatePadding: =4
      TemplateSize: =60

    Controls:
      Alerta_BG:
        Control: Rectangle
        Properties:
          Width: =Parent.TemplateWidth - 16
          Height: =Parent.TemplateHeight - 4
          X: =8
          Fill: =If(ThisItem.Severidade = "CRITICO", RGBA(239,68,68,0.1), If(ThisItem.Severidade = "ALTO", RGBA(250,204,21,0.1), RGBA(51,65,85,0.4)))
          BorderRadius: =8

      Alerta_Severidade:
        Control: Label
        Properties:
          X: =16
          Y: =8
          Width: =60
          Height: =20
          Text: =If(ThisItem.Severidade = "CRITICO", "🔴 CRIT", If(ThisItem.Severidade = "ALTO", "🟡 ALTO", "🟢 BAIXO"))
          Size: =10

      Alerta_Texto:
        Control: Label
        Properties:
          X: =16
          Y: =28
          Width: =340
          Height: =28
          Text: =ThisItem.Mensagem
          Color: =RGBA(226, 232, 240, 1)
          Size: =12

  # === RODAPÉ ===
  Footer_Label:
    Control: Label
    Properties:
      X: =216
      Y: =Parent.Height - 32
      Width: =Parent.Width - 220
      Height: =28
      Text: ="Última atualização: " & UltimaAtualizacao & "  •  VMO GAB v1.0  •  Powered by Power Platform + Copilot Studio"
      Color: =RGBA(100, 116, 139, 1)
      Size: =11
      Align: =Align.Center
